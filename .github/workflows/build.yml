name: Build OpenWrt for Xiaomi BE7000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /var/lib/mysql /usr/local/lib/android
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl libelf-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            device-tree-compiler u-boot-tools bc qemu-user-static

      - name: Run build script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: be7000-openwrt-docker
          path: |
            bin/
            *.img
            *.bin
            *.tar.gz
